<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bestRedGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="40%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
  </defs>
  <!-- Background with official-looking premium red gradient -->
  <rect x="0" y="0" width="100" height="100" rx="28" fill="url(#bestRedGradient)" />
  
  <!-- Central White Circle -->
  <circle cx="50" cy="50" r="7" fill="white" />
  
  <!-- The Three Spokes connecting Center to the Triangle Corners -->
  <line x1="50" y1="50" x2="50" y2="35" stroke="white" stroke-width="4.5" stroke-linecap="round" />
  <line x1="50" y1="50" x2="63" y2="57.5" stroke="white" stroke-width="4.5" stroke-linecap="round" />
  <line x1="50" y1="50" x2="37" y2="57.5" stroke="white" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Central Triangle Outline -->
  <path d="M 50 35 A 15 15 0 0 1 63 57.5 A 15 15 0 0 1 37 57.5 A 15 15 0 0 1 50 35 Z" fill="none" stroke="white" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />
  
  <!-- Three Propeller/Pinwheel Blades defined using 120-degree rotation symmetry for mathematical perfection -->
  <path d="M 37 57.5 C 22 55, 12 42, 10 21 C 25 30, 38 35, 50 35 C 43 45, 40 50, 37 57.5 Z" fill="white" />
  <path d="M 37 57.5 C 22 55, 12 42, 10 21 C 25 30, 38 35, 50 35 C 43 45, 40 50, 37 57.5 Z" fill="white" transform="rotate(120, 50, 50)" />
  <path d="M 37 57.5 C 22 55, 12 42, 10 21 C 25 30, 38 35, 50 35 C 43 45, 40 50, 37 57.5 Z" fill="white" transform="rotate(240, 50, 50)" />
</svg>
